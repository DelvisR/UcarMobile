name: Spellcheck

on:
  pull_request:

jobs:
  check-spelling:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Run spellcheck
        uses: rojopolis/spellcheck-github-actions@0.52.0
        with:
          config_path: .spellcheck.yml
          task_name: Markdown
